<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>nahdran - Garamond mockup</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="apple.css">
<script>(function(){var t=localStorage.getItem("nahdran-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t})()</script>
<link rel="manifest" href="manifest.webmanifest">

<meta name="theme-color" content="#f5f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head><body>
<div id="map"></div>
<header><h1>nahdran</h1><div class="hr"><button id="theme" aria-label="Toggle dark or light mode">&#9680;</button><button id="gps">&#9678; My location</button></div></header>
<section id="sheet">
  <div id="grab" aria-label="Drag or tap to expand the list"><span></span></div>
  <div id="cats"></div>
  <div class="row">
    <label>Radius <b id="rv">1 km</b></label>
    <input type="range" id="radius" min="250" max="5000" step="250" value="1000">
  </div>
  <div class="row"><label class="chk"><input type="checkbox" id="open"> Open now</label>
  <span id="status">Tap the map to set a spot</span></div>
  <ul id="list"></ul>
  <p class="foot" id="fresh"></p>
  <p class="foot">Data &copy; OpenStreetMap contributors. Opening hours come from OSM and may be missing or off.</p>
</section>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="hours.js"></script>
<script src="app.js"></script>
<script>document.getElementById("theme").onclick=function(){var d=document.documentElement,t=d.dataset.theme==="dark"?"light":"dark";d.dataset.theme=t;localStorage.setItem("nahdran-theme",t);var m=document.querySelector("meta[name=theme-color]");if(m)m.content=t==="dark"?"#000000":"#f5f5f7"}</script>
</body></html>
