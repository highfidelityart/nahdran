name: Update places data
on:
  schedule:
    - cron: '17 3 * * 1'   # weekly, Mondays 03:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Pull places from OpenStreetMap (Overpass)
        run: python3 scripts/build_places.py
      - name: Commit if changed
        run: |
          git config user.name "places-bot"
          git config user.email "places-bot@users.noreply.github.com"
          git add -A data/
          git diff --cached --quiet || (git commit -m "Update places data" && git pull --rebase -X theirs && git push)
